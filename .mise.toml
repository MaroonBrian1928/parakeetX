[tools]
python = "3.12"
uv = "latest"

[tasks.sync]
description = "Install all dependencies with uv"
run = "uv sync --all-extras --no-extra cuda-legacy --dev"

[tasks.test]
description = "Run unit and route tests"
run = "uv run pytest"

[tasks.serve]
description = "Run FastAPI locally"
run = "uv run uvicorn parakeetx_api_server.main:app --host ${UVICORN_HOST:-0.0.0.0} --port ${UVICORN_PORT:-7317}"

[tasks.lock]
description = "Refresh uv.lock"
run = "uv lock"

[tasks.speakrs-image]
description = "Build and push the speakrs artifact image (Dockerfile.speakrs; ~45 min sm_52 ONNX Runtime build)"
run = """
tag=ghcr.io/maroonbrian1928/parakeetx-speakrs:v2
docker build -f Dockerfile.speakrs -t "$tag" \
  --label org.opencontainers.image.source=https://github.com/MaroonBrian1928/parakeetX \
  --label "org.opencontainers.image.description=speakrs diarization CLI, models and ONNX Runtime (incl. sm_52 build) for ParakeetX" .
docker push "$tag"
"""
