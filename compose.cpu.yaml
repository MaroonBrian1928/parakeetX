services:
  api-cpu:
    image: ghcr.io/maroonbrian1928/parakeetx:cpu
    build:
      context: .
      dockerfile: Dockerfile.cpu
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PARAKEET__DEVICE: cpu
      DIARIZATION__DEVICE: cpu
    ports:
      - "${HOST_PORT:-7474}:${UVICORN_PORT:-7474}"
